; M5Dice — 3D dice for the M5StickS3 (ESP32-S3-PICO-1-N8R8)

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The StickS3 carries 8 MB of flash and 8 MB of octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv

; Without dropping -std=gnu++11 the board builds as C++11; -Os makes the
; per-pixel shading about twice as slow as -O2 (seen in M5TalkingTom)
build_unflags =
    -std=gnu++11
    -Os
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -O2

lib_deps = m5stack/M5Unified

; `pio run -e sticks3 -t merged` builds a single image for M5Burner
extra_scripts = post:tools/merged_image.py

monitor_speed = 115200

; Native USB shows up as /dev/cu.usbmodem*; without this PlatformIO may pick
; /dev/cu.Bluetooth-Incoming-Port when the board is not connected yet
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

; Everything in lib/ is hardware-independent and is tested on the host
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -O2
